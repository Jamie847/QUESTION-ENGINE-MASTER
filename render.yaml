# Question Engine — Render Blueprint
# Corrections vs spec §2 (see docs/OPEN-QUESTIONS-for-CP.md Q7):
#   1. Postgres plan is 0.1c-256mb (current ID). basic-256mb is legacy-only.
#   2. Shared vars live in an envVarGroup — not prose.
#   3. DATABASE_URL is declared on EACH service (env groups cannot hold
#      fromDatabase references).
# No pgvector. Dedup is lexical (Q1 ruling d). Do not CREATE EXTENSION vector.

databases:
  - name: question-engine-db
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: question_engine
    user: question_engine
    region: oregon

envVarGroups:
  - name: question-engine-shared
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      # Optional lock. Leave unset so the onrender URL opens and Run works.
      # Set a value in the Dashboard only if you want ?token= again.
      - key: DASHBOARD_TOKEN
        value: ""
      - key: JUDGMENT_MODEL
        value: claude-fable-5
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: RUN_BUDGET_USD
        value: "5.00"
      - key: RUN_TOKEN_CAP
        value: "400000"
      - key: SOURCE_TIMEOUT_SECONDS
        value: "45"
      - key: PYTHON_VERSION
        value: "3.12.3"

services:
  - type: web
    name: question-engine-dashboard
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dashboard.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: question-engine-shared
      - key: DATABASE_URL
        fromDatabase:
          name: question-engine-db
          property: connectionString

  - type: cron
    name: question-engine-swarm
    runtime: python
    plan: starter
    region: oregon
    schedule: "0 10 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m swarm.run_daily
    envVars:
      - fromGroup: question-engine-shared
      - key: DATABASE_URL
        fromDatabase:
          name: question-engine-db
          property: connectionString
