# Question Engine — Render Blueprint
# Corrections vs spec §2 (see docs/OPEN-QUESTIONS-for-CP.md Q7):
#   1. Postgres plan is 0.1c-256mb (current ID). basic-256mb is legacy-only.
#   2. Shared vars live in an envVarGroup — not prose.
#   3. DATABASE_URL is declared on EACH service (env groups cannot hold
#      fromDatabase references).
# Dedup stays lexical (Q1 ruling d). WO-014 adds pgvector as a memory
# catalog only — CREATE EXTENSION vector runs on deploy.

databases:
  - name: question-engine-db
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: question_engine
    user: question_engine
    region: oregon

envVarGroups:
  - name: question-engine-shared
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
      - key: REGULATIONS_GOV_API_KEY
        sync: false
      - key: SAM_GOV_API_KEY
        sync: false
      - key: EIA_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: RELIEFWEB_APPNAME
        sync: false
      - key: DESK_MODEL
        value: claude-opus-5-5
      - key: DISPLAY_TZ
        value: "UTC"
      - key: SNIPPET_CHARS
        value: "800"
      - key: SCOUT_SIGNALS_PER_VERTICAL
        value: "30"
      - key: BRAVE_MIN_INTERVAL_S
        value: "1.1"
      # Kept for DASHBOARD_AUTH=on. No generateValue — the Blueprint
      # must not mint a string nobody uses. Do not set value: "".
      - key: DASHBOARD_TOKEN
        sync: false
      - key: DASHBOARD_AUTH
        value: "off"
      - key: MAX_RUNS_PER_DAY
        value: "5"
      - key: RUN_COOLDOWN_SECONDS
        value: "600"
      - key: JUDGMENT_MODEL
        value: claude-fable-5
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: FALLBACK_MODEL
        value: claude-opus-5-5
      - key: RUN_BUDGET_USD
        value: "5.00"
      - key: RUN_TOKEN_CAP
        value: "400000"
      - key: SOURCE_TIMEOUT_SECONDS
        value: "45"
      - key: STALE_AFTER_DAYS
        value: "3"
      - key: SOURCE_DEAD_AFTER_RUNS
        value: "3"
      - key: OPPORTUNITY_MAX
        value: "5"
      - key: ASSAYS_PER_DAY
        value: "10"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: VOYAGE_API_KEY
        sync: false
      - key: EMBED_MODEL
        value: voyage-4
      - key: EMBED_DIMS
        value: "512"
      - key: MEMORY_SEARCHES_PER_DAY
        value: "200"

services:
  - type: web
    name: question-engine-dashboard
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    # One-shot WO-011 link repair (later deploys print skipped=1).
    # --close-orphans fails running rows that no longer hold the lock
    # (a deploy that killed the worker).
    # --refuse-if-locked fails the deploy (old instance keeps serving)
    # when a run still holds the lock. Never cut over mid-swarm.
    preDeployCommand: python -m swarm.run_daily --refuse-if-locked --repair-links --close-orphans --backfill-memory
    startCommand: uvicorn dashboard.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: question-engine-shared
      - key: DATABASE_URL
        fromDatabase:
          name: question-engine-db
          property: connectionString

  - type: cron
    name: question-engine-swarm
    runtime: python
    plan: starter
    region: oregon
    # Manual-only (Operator 2026-09-03). Render requires `schedule` on type: cron
    # (schema required: type, name, runtime, schedule). This is 00:00 UTC on
    # 29 February — a leap-day — so it does not fire on a daily/weekly cadence.
    # Do not replace this with a schedule that looks real. Suspend is not used:
    # a suspended cron cannot be Trigger-Run'd. Keep this service so Dashboard
    # Trigger Run and Controls → Run swarm now both still work.
    schedule: "0 0 29 2 *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m swarm.run_daily
    envVars:
      - fromGroup: question-engine-shared
      - key: DATABASE_URL
        fromDatabase:
          name: question-engine-db
          property: connectionString
