# Phase 1 thinner swarm: three verticals. Add rows here later; scouts
# are config-driven and do not need new Python for a new vertical.
verticals:
  - id: ai
    name: AI
    enabled: true
    phase: 1
    search_queries:
      - "artificial intelligence breakthrough"
      - "foundation model regulation"
      - "AI agents enterprise"
      - "open source LLM"
    reddit_subs:
      - MachineLearning
      - LocalLLaMA
      - OpenAI
      - artificial
    hn_keywords:
      - AI
      - LLM
      - GPT
      - Claude
      - model
      - agent
      - transformer
      - inference
      - GPU
      - alignment
